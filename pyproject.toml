[project]
name = "crowd-dwell"
version = "0.1.0"
description = "People counting, dwell time and heatmaps from video with YOLO + ByteTrack"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.4",
    "lap>=0.5.12",
    "supervision>=0.26",
    "opencv-python>=4.10",
    "numpy>=2,<2.4",
    "scipy>=1.14",
    "pandas>=2.2",
    "pyyaml>=6",
    "plotly>=6",
    "kaleido>=1",
]

[project.optional-dependencies]
coreml = ["coremltools>=8"]

[project.scripts]
crowd-track = "crowd_dwell.detect_track:main"
crowd-analyze = "crowd_dwell.analytics:main"
crowd-eval = "crowd_dwell.evaluate:main"
crowd-bench = "crowd_dwell.benchmark:main"
crowd-zones = "crowd_dwell.zones:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
